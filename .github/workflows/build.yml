name: Build OpenMux Beta3

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Descompactar o zip do projeto
        run: |
          ls -la
          unzip -q openmux-beta3-source.zip
          ls openmux

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar NDK e plataforma (SDK ja vem na maquina)
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "SDK em $SDK"
          SM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager | head -1)
          echo "sdkmanager: $SM"
          set +e
          yes | "$SM" --sdk_root="$SDK" --licenses > /dev/null 2>&1
          set -e
          "$SM" --sdk_root="$SDK" "platforms;android-34" "build-tools;34.0.0" "ndk;27.2.12479018" > /dev/null
          ls "$SDK/ndk"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Compilar FFmpeg para armeabi-v7a
        working-directory: openmux
        run: bash scripts/build-ffmpeg.sh armeabi-v7a

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Testes unitarios
        working-directory: openmux
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Gerar APK
        working-directory: openmux
        run: gradle :app:assembleRelease --no-daemon

      - name: Verificar e copiar APK
        working-directory: openmux
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          unzip -l "$APK" | grep -E "lib/armeabi-v7a/(libffmpeg|libffprobe)\.so"
          mkdir -p dist
          cp "$APK" dist/OpenMuxBridge-Beta2-armv7a.apk
          sha256sum dist/OpenMuxBridge-Beta2-armv7a.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OpenMuxBridge-Beta2-armv7a
          path: openmux/dist/*
