name: Build OpenMux

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Descompactar o zip do projeto
        run: |
          ls -la
          ZIP=$(ls *.zip | head -1)
          echo "Usando $ZIP"
          unzip -q "$ZIP"
          ls openmux

      - name: Correcao do codigo (patch 1)
        working-directory: openmux
        run: |
          sed -i 's|if (Build.VERSION.SDK_INT >= 33) return p.pid().toInt()|// pid() removido|' app/src/main/kotlin/org/openmux/bridge/FfmpegEngine.kt
          grep -n "pid()" app/src/main/kotlin/org/openmux/bridge/FfmpegEngine.kt || echo "patch aplicado"

      - name: Correcao do codigo (patch 2 - mascara de credenciais)
        working-directory: openmux
        run: |
          cat > /tmp/patch2.py <<'PYEOF'
          import sys
          p = sys.argv[1]
          s = open(p, encoding='utf-8').read()
          a = s.index('    private val SECRET_RE')
          b = s.index('    /** Mantém apenas')
          new_re = ('    private val HEADER_RE = Regex(\n'
                    '        """(?i)(proxy-authorization|authorization|set-cookie|cookie)(["\']?\\s*[:=]\\s*)[^\\r\\n]+"""\n'
                    '    )\n'
                    '    private val SECRET_RE = Regex(\n'
                    '        """(?i)(token|api[_-]?key|password|passwd|secret|signature|sig)(["\']?\\s*[:=]\\s*)[^\\s&"\',;]+"""\n'
                    '    )\n\n')
          s = s[:a] + new_re + s[b:]
          old = '        r = SECRET_RE.replace(r) { m -> m.groupValues[1] + m.groupValues[2] + "***" }\n'
          new = ('        r = HEADER_RE.replace(r) { m -> m.groupValues[1] + m.groupValues[2] + "***" }\n'
                 '        r = SECRET_RE.replace(r) { m -> m.groupValues[1] + m.groupValues[2] + "***" }\n')
          assert old in s
          s = s.replace(old, new)
          open(p, 'w', encoding='utf-8').write(s)
          print("patch2 ok")

          PYEOF
          python3 /tmp/patch2.py app/src/main/kotlin/org/openmux/bridge/Util.kt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar NDK e plataforma (SDK ja vem na maquina)
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "SDK em $SDK"
          SM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager | head -1)
          echo "sdkmanager: $SM"
          set +e
          yes | "$SM" --sdk_root="$SDK" --licenses > /dev/null 2>&1
          set -e
          "$SM" --sdk_root="$SDK" "platforms;android-34" "build-tools;34.0.0" "ndk;27.2.12479018" > /dev/null
          ls "$SDK/ndk"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Compilar FFmpeg para armeabi-v7a
        working-directory: openmux
        run: bash scripts/build-ffmpeg.sh armeabi-v7a

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Testes unitarios
        working-directory: openmux
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Gerar APK
        working-directory: openmux
        run: gradle :app:assembleRelease --no-daemon

      - name: Verificar e copiar APK
        working-directory: openmux
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          unzip -l "$APK" | grep -E "lib/armeabi-v7a/(libffmpeg|libffprobe)\.so"
          mkdir -p dist
          cp "$APK" dist/OpenMuxBridge-Beta2-armv7a.apk
          sha256sum dist/OpenMuxBridge-Beta2-armv7a.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OpenMuxBridge-Beta2-armv7a
          path: openmux/dist/*
