name: Build OpenMux

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Descompactar o zip do projeto
        run: |
          ls -la
          ZIP=$(ls *.zip | head -1)
          echo "Usando $ZIP"
          unzip -q "$ZIP"
          ls openmux

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Instalar NDK e plataforma
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Compilar FFmpeg para armeabi-v7a
        working-directory: openmux
        run: bash scripts/build-ffmpeg.sh armeabi-v7a

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Testes unitarios
        working-directory: openmux
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Gerar APK
        working-directory: openmux
        run: gradle :app:assembleRelease --no-daemon

      - name: Verificar e copiar APK
        working-directory: openmux
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          unzip -l "$APK" | grep -E "lib/armeabi-v7a/(libffmpeg|libffprobe)\.so"
          mkdir -p dist
          cp "$APK" dist/OpenMuxBridge-Beta2-armv7a.apk
          sha256sum dist/OpenMuxBridge-Beta2-armv7a.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OpenMuxBridge-Beta2-armv7a
          path: openmux/dist/*
